<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>イーグル会</title>
  <style>
    /* Tailwindロード前の一瞬のスタイル崩れ(FOUC)防止 */
    body { background-color: #f3f4f6; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; padding: 1rem; }
    #mainSection { display: none; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-4 text-gray-800">

  <div id="loginSection" class="w-full max-w-md bg-white rounded-xl shadow-md p-6 mt-10">
    <h2 class="text-2xl font-bold mb-6 text-center text-green-700 tracking-wider">イーグル会</h2>
    <div class="space-y-4 mb-6">
      <div>
        <label for="loginId" class="block text-gray-700 text-sm font-bold mb-1">ログインID</label>
        <input type="text" id="loginId" autocomplete="username" class="w-full p-2.5 border border-gray-300 rounded focus:outline-none focus:border-green-500 transition-colors">
      </div>
      <div>
        <label for="loginPw" class="block text-gray-700 text-sm font-bold mb-1">パスワード</label>
        <input type="password" id="loginPw" autocomplete="current-password" class="w-full p-2.5 border border-gray-300 rounded focus:outline-none focus:border-green-500 transition-colors">
      </div>
    </div>
    <button id="loginBtn" onclick="onLogin()" onkeydown="handleEnterKey(event, onLogin)" aria-label="ログインする" class="w-full bg-green-600 text-white font-bold p-3 rounded-lg hover:bg-green-700 transition-colors shadow-sm">ログイン</button>
    <p id="loginError" class="text-red-500 mt-4 text-center text-sm font-bold hidden"></p>
  </div>

  <div id="mainSection" class="w-full max-w-md mt-4 hidden space-y-6 pb-10">

    <div class="bg-white border-2 border-green-500 rounded-xl shadow-sm overflow-hidden">
      <div class="bg-green-500 text-white text-sm font-bold py-1.5 text-center tracking-widest flex items-center justify-center gap-2">
        <span>🏌️</span> 次回イーグル会 開催予定
      </div>
      <div class="p-4 bg-green-50 text-center space-y-2.5">
        <p id="nextCompeDateDisplay" class="text-xl font-bold text-green-800 leading-relaxed break-keep">データ読み込み中...</p>
        <div id="nextClubCompeBadge" class="hidden">
          <span class="inline-block bg-amber-100 border border-amber-200 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-md shadow-sm animate-pulse">
            🏆 同時開催: <span id="nextClubCompeName"></span>
          </span>
        </div>
        <div id="scheduleToggleBtnContainer" class="hidden pt-2 border-t border-green-200/60 mt-2">
          <button onclick="toggleFutureSchedules()" onkeydown="handleEnterKey(event, toggleFutureSchedules)" aria-label="今後のスケジュールを表示する" class="text-[10px] text-green-700 font-bold bg-green-100 hover:bg-green-200 transition-colors px-3 py-1 rounded-full mx-auto inline-flex items-center gap-1 shadow-sm">
            <span>📅 今後のスケジュール</span> (<span id="futureScheduleCount">0</span>件)
          </button>
        </div>
      </div>
      <div id="futureSchedulesSection" class="hidden border-t border-green-100 bg-white p-3 max-h-48 overflow-y-auto">
        <div id="futureSchedulesList" class="space-y-3"></div>
      </div>
    </div>

    <div class="flex justify-between items-end px-1">
      <h2 class="text-xl font-bold text-green-700">こんにちは、<span id="userName"></span> さん</h2>
      <button onclick="onLogout()" onkeydown="handleEnterKey(event, onLogout)" aria-label="ログアウトする" class="text-xs text-gray-500 underline hover:text-gray-700">ログアウト</button>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm">
      <h3 class="font-bold text-gray-800 border-b pb-2 mb-3">⛳ あなたの最新ハンディキャップ</h3>
      <div class="grid grid-cols-2 gap-3 text-center items-stretch">
        <div class="bg-blue-50 rounded-lg p-2.5 border border-blue-100 flex flex-col justify-between">
          <div>
            <p class="text-[11px] text-gray-600 font-bold mb-1">イーグル会 HDCP</p>
            <p id="eagleHdcpDisplay" class="text-3xl font-bold text-blue-700 my-1">-</p>
            <p class="text-[10px] text-gray-500 mb-2">更新日: <span id="eagleUpdateDisplay"></span></p>
          </div>
          <div class="mt-auto">
            <p class="text-[9px] text-blue-600 font-semibold bg-blue-100/70 inline-block px-2 py-1 rounded-md mx-auto">※1月と7月にHDCPリセット</p>
          </div>
        </div>
        <div class="bg-purple-50 rounded-lg p-2.5 border border-purple-100 flex flex-col justify-between">
          <div>
            <p class="text-[11px] text-gray-600 font-bold mb-1">倶楽部公式 HDCP</p>
            <p id="officialHdcpDisplay" class="text-3xl font-bold text-purple-700 my-1">-</p>
            <p class="text-[10px] text-gray-500 mb-2">更新日: <span id="officialUpdateDisplay"></span></p>
          </div>
          <div class="mt-auto">
            <button onclick="toggleOfficialHdcpHistory()" onkeydown="handleEnterKey(event, toggleOfficialHdcpHistory)" aria-label="公式ハンディの推移を表示する" class="text-[10px] text-purple-700 font-bold bg-purple-100 hover:bg-purple-200 transition-colors px-2 py-1 rounded-md w-full text-center block">📊 1年の推移を見る</button>
          </div>
        </div>
      </div>
      <div id="officialHdcpHistorySection" class="hidden mt-4 pt-4 border-t border-dashed border-gray-200 space-y-4">
        <div class="py-1"><canvas id="officialHdcpChart"></canvas></div>
        <div class="max-h-40 overflow-y-auto">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="bg-gray-50 border-b text-gray-500">
                <th scope="col" class="p-2 font-normal">年月</th>
                <th scope="col" class="p-2 text-right pr-4 font-normal">公式HDCP</th>
              </tr>
            </thead>
            <tbody id="officialHdcpTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
    
    <div id="adminUploadSection" class="border-2 border-dashed border-green-300 rounded-xl p-4 bg-green-50 text-center hidden">
      <h3 class="font-bold text-green-800 mb-2 text-sm">【管理者用】成績表アップロード</h3>
      <input type="file" id="imageFile" accept="image/*" class="mb-3 text-xs text-gray-600 w-full">
      <button onclick="onUpload()" id="uploadBtn" class="w-full bg-blue-600 text-white text-sm font-bold p-2 rounded hover:bg-blue-700 transition-colors">画像を解析して登録</button>
      <p id="uploadStatus" class="mt-2 text-xs text-gray-700 font-semibold"></p>
    </div>

    <div id="adminPasswordSection" class="border-2 border-dashed border-orange-300 rounded-xl p-4 bg-orange-50 text-center hidden">
      <h3 class="font-bold text-orange-800 mb-3 text-sm">【管理者用】パスワードリセット</h3>
      <div class="space-y-2 text-left">
        <div>
          <label for="resetTargetId" class="block text-xs font-bold text-gray-700 mb-1">対象のログインID</label>
          <input type="text" id="resetTargetId" class="w-full p-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-orange-400">
        </div>
        <div>
          <label for="resetNewPassword" class="block text-xs font-bold text-gray-700 mb-1">新しいパスワード</label>
          <input type="text" id="resetNewPassword" class="w-full p-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-orange-400" placeholder="4文字以上">
        </div>
      </div>
      <button onclick="onResetPassword()" id="resetPasswordBtn" class="w-full mt-3 bg-orange-500 text-white text-sm font-bold p-2 rounded hover:bg-orange-600 transition-colors">パスワードをリセット</button>
      <p id="resetPasswordStatus" class="mt-2 text-xs font-semibold text-gray-700"></p>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm">
      <div class="flex justify-between items-center border-b pb-2 mb-3">
        <h3 class="font-bold text-gray-800">📈 スコア推移</h3>
        <div class="flex space-x-1 bg-gray-100 rounded-md p-1 border border-gray-200">
          <button id="btnChart" onclick="toggleScoreView('chart')" aria-label="グラフ表示に切り替え" class="text-[10px] px-3 py-1 rounded bg-white shadow-sm text-gray-800 font-bold transition-all">グラフ</button>
          <button id="btnTable" onclick="toggleScoreView('table')" aria-label="表形式に切り替え" class="text-[10px] px-3 py-1 rounded text-gray-500 hover:text-gray-800 font-bold transition-all">表</button>
        </div>
      </div>
      <div id="scoreChartContainer" class="py-2"><canvas id="myChart"></canvas></div>
      <div id="scoreTableContainer" class="hidden max-h-60 overflow-y-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-gray-50 border-b text-gray-500 text-xs">
              <th scope="col" class="p-2 font-normal">日付</th>
              <th scope="col" class="p-2 text-right font-normal">順位</th>
              <th scope="col" class="p-2 text-right font-normal">GROSS</th>
              <th scope="col" class="p-2 pr-4 text-right font-normal">NET</th>
            </tr>
          </thead>
          <tbody id="myScoreTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm">
      <div class="flex justify-between items-center border-b pb-2 mb-3">
        <h3 class="font-bold text-gray-800">🏆 コンペ結果</h3>
        <select id="dateSelect" onchange="renderScoresByDate()" aria-label="開催日を選択" class="text-xs border border-gray-300 rounded p-1.5 text-gray-700 bg-white shadow-sm focus:outline-none focus:border-green-500 hidden"></select>
      </div>
      <div class="max-h-60 overflow-y-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-gray-50 border-b text-gray-500 text-xs">
              <th scope="col" class="p-2 w-16 text-center font-normal">順位</th>
              <th scope="col" class="p-2 font-normal">名前</th>
              <th scope="col" class="p-2 text-right font-normal">GROSS</th>
              <th scope="col" class="p-2 pr-4 text-right font-normal">NET</th>
            </tr>
          </thead>
          <tbody id="scoreContainer"></tbody>
        </table>
      </div>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm">
      <div class="flex flex-col border-b pb-2 mb-3 gap-2">
        <div class="flex justify-between items-center">
          <h3 id="rankingTitle" class="font-bold text-gray-800 text-sm">通算平均NETランキング</h3>
          <select id="termSelect" onchange="renderRankingByTerm()" aria-label="集計期間を選択" class="text-xs border border-gray-300 rounded p-1.5 text-gray-700 bg-white shadow-sm focus:outline-none focus:border-green-500 hidden"></select>
        </div>
      </div>
      <div class="max-h-60 overflow-y-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-gray-50 border-b text-gray-500 text-xs">
              <th scope="col" class="p-2 w-16 text-center font-normal">順位</th>
              <th scope="col" class="p-2 font-normal">名前</th>
              <th scope="col" class="p-2 text-right font-normal">平均NET</th>
              <th scope="col" class="p-2 pr-4 text-right font-normal">参戦数</th>
            </tr>
          </thead>
          <tbody id="rankingTableBody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    (function () {
      'use strict';

      // ─────────────────────────────────────
      // CONFIG
      // ─────────────────────────────────────
      const CONFIG = {
        API_URL: "https://script.google.com/macros/s/AKfycbyFYQinKD-hq6rYrtbhWFJKeAkykZr0enBDm3m4rgeYGoQ5uuzxGsbkjR0VezsFDDLCKg/exec",
        CHART_COLOR_GROSS: 'rgb(255, 99, 132)',
        CHART_COLOR_HDCP:  'rgb(147, 51, 234)',
      };

      // ─────────────────────────────────────
      // STATE
      // ─────────────────────────────────────
      const State = {
        currentUser: null,
        authToken: null,
        allScoreHistory: [],
        rankingByTerm: {},
        rankingCache: {},
        isOfficialHistoryLoaded: false,
        officialChartInstance: null,
        myChartInstance: null,
      };

      // ─────────────────────────────────────
      // API
      // ─────────────────────────────────────
      const API = {
        async call(action, data = {}) {
          const payload = { action, ...data };
          if (State.authToken) payload.token = State.authToken;
          const response = await fetch(CONFIG.API_URL, {
            method: "POST", headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload), redirect: "follow" 
          });
          return await response.json();
        },
        async loadChartJs() {
          if (window.Chart) return Promise.resolve();
          return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/chart.js';
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
          });
        }
      };

      // ─────────────────────────────────────
      // UI Utility
      // ─────────────────────────────────────
      const UI = {
        showSkeletons() {
          const skeletonRow = `
            <tr class="animate-pulse border-b">
              <td class="p-3"><div class="h-3 bg-gray-200 rounded w-3/4 mx-auto"></div></td>
              <td class="p-3"><div class="h-3 bg-gray-200 rounded w-full"></div></td>
              <td class="p-3"><div class="h-3 bg-gray-200 rounded w-1/2 ml-auto"></div></td>
              <td class="p-3 pr-4"><div class="h-3 bg-gray-200 rounded w-1/2 ml-auto"></div></td>
            </tr>`.repeat(5);
          document.getElementById('scoreContainer').innerHTML = skeletonRow;
          document.getElementById('rankingTableBody').innerHTML = skeletonRow;
          document.getElementById('myScoreTableBody').innerHTML = skeletonRow;
        },
        showErrorAndRetry() {
          const html = `<tr><td colspan="4" class="text-center p-4 text-red-500 text-xs font-bold">通信エラー<button onclick="loadAllData()" class="ml-3 text-blue-600 underline">再試行</button></td></tr>`;
          ['scoreContainer', 'rankingTableBody', 'myScoreTableBody'].forEach(id => document.getElementById(id).innerHTML = html);
        },
        formatYearMonth(dateStr) {
          const p = dateStr.split('/');
          return p.length >= 2 ? `${p[0].slice(-2)}年${parseInt(p[1], 10)}月` : dateStr;
        },
        toggleScoreView(view) {
          const isChart = (view === 'chart');
          document.getElementById('scoreChartContainer').classList.toggle('hidden', !isChart);
          document.getElementById('scoreTableContainer').classList.toggle('hidden', isChart);
          document.getElementById('btnChart').className = isChart ? "text-[10px] px-3 py-1 rounded bg-white shadow-sm text-gray-800 font-bold transition-all" : "text-[10px] px-3 py-1 rounded text-gray-500 hover:text-gray-800 font-bold transition-all";
          document.getElementById('btnTable').className = !isChart ? "text-[10px] px-3 py-1 rounded bg-white shadow-sm text-gray-800 font-bold transition-all" : "text-[10px] px-3 py-1 rounded text-gray-500 hover:text-gray-800 font-bold transition-all";
        },
        handleEnterKey(event, fn) {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); fn(); }
        }
      };

      // ─────────────────────────────────────
      // Auth
      // ─────────────────────────────────────
      const Auth = {
        async login() {
          const id = document.getElementById('loginId').value;
          const pw = document.getElementById('loginPw').value;
          const errEl = document.getElementById('loginError');
          const btn = document.getElementById('loginBtn');
          
          errEl.classList.add('hidden');
          btn.disabled = true;
          btn.innerHTML = '<span class="inline-block animate-spin mr-1">⏳</span> 認証中...';

          try {
            const res = await API.call('checkLogin', { id, password: pw });
            if (res.success) {
              State.currentUser = res.name;
              State.authToken = res.token; 
              State.isOfficialHistoryLoaded = false; 
              
              document.getElementById('officialHdcpHistorySection').classList.add('hidden'); 
              document.getElementById('futureSchedulesSection').classList.add('hidden'); 
              document.getElementById('loginPw').value = ''; // メモリ保護
              
              document.getElementById('userName').innerText = State.currentUser;
              document.getElementById('eagleHdcpDisplay').innerText = res.eagleHdcp || "-";
              document.getElementById('officialHdcpDisplay').innerText = res.officialHdcp || "-";
              document.getElementById('eagleUpdateDisplay').innerText = res.eagleUpdateDate;
              document.getElementById('officialUpdateDisplay').innerText = res.officialUpdateDate;            
              
              if (res.nextCompe) {
                document.getElementById('nextCompeDateDisplay').innerText = `${res.nextCompe.dateText} ${res.nextCompe.timeText}`;
                if (res.nextCompe.clubCompe) {
                  document.getElementById('nextClubCompeName').innerText = res.nextCompe.clubCompe;
                  document.getElementById('nextClubCompeBadge').classList.remove('hidden');
                } else document.getElementById('nextClubCompeBadge').classList.add('hidden');
              } else {
                document.getElementById('nextCompeDateDisplay').innerText = "未定";
                document.getElementById('nextClubCompeBadge').classList.add('hidden');
              }

              const listContainer = document.getElementById('futureSchedulesList');
              listContainer.innerHTML = '';
              if (res.futureSchedules && res.futureSchedules.length > 0) {
                document.getElementById('futureScheduleCount').innerText = res.futureSchedules.length;
                document.getElementById('scheduleToggleBtnContainer').classList.remove('hidden');
                res.futureSchedules.forEach(sched => {
                  let html = `<div class="flex flex-col border-b border-gray-100 pb-2.5 last:border-0 last:pb-0"><div class="flex justify-between items-center text-xs"><span class="font-bold text-gray-800">${sched.dateText}</span><span class="text-gray-500 font-semibold bg-gray-100 px-2 py-0.5 rounded shadow-sm">${sched.timeText}</span></div>`;
                  if (sched.clubCompe) html += `<div class="mt-1 text-[10px] text-amber-700 font-bold flex items-center gap-1"><span>🏆 同時開催:</span> <span>${sched.clubCompe}</span></div>`;
                  html += `</div>`;
                  listContainer.innerHTML += html;
                });
              } else document.getElementById('scheduleToggleBtnContainer').classList.add('hidden');

              document.getElementById('loginSection').classList.add('hidden');
              document.getElementById('mainSection').classList.remove('hidden');
              
              if (res.role === '管理者') {
                document.getElementById('adminUploadSection').classList.remove('hidden');
                document.getElementById('adminPasswordSection').classList.remove('hidden');
              }

              await API.loadChartJs(); // グラフライブラリ遅延ロード
              loadAllData();
            } else {
              errEl.innerText = "IDまたはパスワードが違います";
              errEl.classList.remove('hidden');
            }
          } catch {
            errEl.innerText = "通信エラーが発生しました";
            errEl.classList.remove('hidden');
          } finally {
            btn.disabled = false;
            btn.innerText = 'ログイン';
          }
        },
        logout() {
          // 最も確実なセキュリティ担保のため画面完全リロード
          location.reload(); 
        }
      };

      // ─────────────────────────────────────
      // ChartModule
      // ─────────────────────────────────────
      const ChartModule = {
        createLineChart(canvasId, labels, data, color, existingInstance) {
          const ctx = document.getElementById(canvasId).getContext('2d');
          if (existingInstance) existingInstance.destroy();
          const bgColor = color.replace('rgb(', 'rgba(').replace(')', ', 0.1)');
          return new Chart(ctx, {
            type: 'line',
            data: {
              labels,
              datasets: [{ data, borderColor: color, backgroundColor: bgColor, borderWidth: 2, pointRadius: 4, pointBackgroundColor: color, tension: 0.3 }]
            },
            options: {
              responsive: true,
              plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
              scales: { y: { display: true, reverse: true } }
            }
          });
        },
        loadMyChart(history) {
          const recent = history.filter(r => new Date(r.date) >= new Date(new Date().setFullYear(new Date().getFullYear() - 1)));
          if (recent.length > 0) {
            const labels = recent.map(r => UI.formatYearMonth(r.date));
            const data = recent.map(r => r.gross);
            State.myChartInstance = this.createLineChart('myChart', labels, data, CONFIG.CHART_COLOR_GROSS, State.myChartInstance);
            
            let html = '';
            [...recent].reverse().forEach(r => {
              let rs = "text-gray-500", rt = `${r.rank}位`;
              if (r.rank == 1) { rs = "text-yellow-600 font-bold"; rt = "🥇 1位"; }
              else if (r.rank == 2) { rs = "text-gray-500 font-bold"; rt = "🥈 2位"; }
              else if (r.rank == 3) { rs = "text-amber-700 font-bold"; rt = "🥉 3位"; }
              html += `<tr class="border-b hover:bg-gray-50"><td class="p-2 text-gray-600 text-[11px] font-bold">${UI.formatYearMonth(r.date)}</td><td class="p-2 text-right ${rs}">${rt}</td><td class="p-2 text-right text-gray-800 font-bold">${r.gross}</td><td class="p-2 pr-4 text-right text-green-600 font-bold">${r.net}</td></tr>`;
            });
            document.getElementById('myScoreTableBody').innerHTML = html;
          }
        },
        async loadOfficialHdcpHistory() {
          const section = document.getElementById('officialHdcpHistorySection');
          const isHidden = section.classList.contains('hidden');
          section.classList.toggle('hidden');
          if (!isHidden || State.isOfficialHistoryLoaded) return;

          const history = await API.call('getOfficialHdcpHistory');
          State.isOfficialHistoryLoaded = true;
          if (!history || history.length === 0) {
            document.getElementById('officialHdcpTableBody').innerHTML = `<tr><td colspan="2" class="text-center p-4 text-gray-400 text-xs">履歴データがありません</td></tr>`;
            return;
          }

          const valid = history.filter(r => r.hdcp !== '不明' && !isNaN(Number(r.hdcp)));
          if (valid.length > 0) {
            State.officialChartInstance = this.createLineChart('officialHdcpChart', valid.map(r => UI.formatYearMonth(r.date)), valid.map(r => Number(r.hdcp)), CONFIG.CHART_COLOR_HDCP, State.officialChartInstance);
          }
          
          let html = '';
          [...history].reverse().forEach(r => {
            const hdcp = r.hdcp === '不明' ? '<span class="text-red-500 font-bold bg-red-50 px-1.5 py-0.5 rounded">不明</span>' : r.hdcp;
            html += `<tr class="border-b hover:bg-gray-50 text-xs"><td class="p-2 text-gray-600 font-medium">${UI.formatYearMonth(r.date)}</td><td class="p-2 text-right pr-4 font-bold text-purple-700">${hdcp}</td></tr>`;
          });
          document.getElementById('officialHdcpTableBody').innerHTML = html;
        }
      };

      // ─────────────────────────────────────
      // Score / Ranking
      // ─────────────────────────────────────
      const Score = {
        setup() {
          const sel = document.getElementById('dateSelect');
          const dates = [...new Set(State.allScoreHistory.map(r => r['日付']))].sort((a, b) => new Date(b) - new Date(a));
          sel.innerHTML = '';
          dates.forEach(d => sel.appendChild(new Option(UI.formatYearMonth(d), d)));
          sel.classList.remove('hidden');
          this.renderByDate();
        },
        renderByDate() {
          const d = document.getElementById('dateSelect').value;
          const filtered = State.allScoreHistory.filter(r => r['日付'] === d).sort((a, b) => Number(a['順位']) - Number(b['順位']));
          let html = '';
          filtered.forEach(r => {
            let rs = "text-gray-700";
            if (r['順位'] == 1) rs = "text-yellow-600 font-bold"; else if (r['順位'] == 2) rs = "text-gray-500 font-bold"; else if (r['順位'] == 3) rs = "text-amber-700 font-bold";
            const isMe = (r['名前'] === State.currentUser);
            html += `<tr class="border-b ${isMe ? "bg-blue-50 font-semibold" : "hover:bg-gray-50"}"><td class="p-2 font-bold text-center ${rs}">${r['順位']} 位</td><td class="p-2 font-bold ${isMe ? "text-blue-800" : "text-gray-800"}">${r['名前']}</td><td class="p-2 text-right text-gray-600">${r['GROSS']}</td><td class="p-2 pr-4 text-right text-green-600 font-bold">${r['NET']}</td></tr>`;
          });
          document.getElementById('scoreContainer').innerHTML = html;
        }
      };

      const Ranking = {
        setup() {
          State.rankingByTerm = {}; State.rankingCache = {};
          State.allScoreHistory.forEach(r => {
            const p = r['日付'].split('/'); if(p.length < 2) return;
            const termKey = `${p[0].slice(-2)}年${parseInt(p[1], 10) >= 7 ? "下期" : "上期"}`;
            if (!State.rankingByTerm[termKey]) State.rankingByTerm[termKey] = {};
            if (r['名前'] && !isNaN(Number(r['NET']))) {
              if (!State.rankingByTerm[termKey][r['名前']]) State.rankingByTerm[termKey][r['名前']] = [];
              State.rankingByTerm[termKey][r['名前']].push(Number(r['NET']));
            }
          });
          const terms = Object.keys(State.rankingByTerm).sort((a, b) => {
            if (parseInt(a.slice(0, 2)) !== parseInt(b.slice(0, 2))) return parseInt(b.slice(0, 2)) - parseInt(a.slice(0, 2));
            return (b.includes("下期") ? 1 : 0) - (a.includes("下期") ? 1 : 0);
          });
          const sel = document.getElementById('termSelect');
          sel.innerHTML = '';
          terms.forEach(t => sel.appendChild(new Option(t, t)));
          sel.classList.remove('hidden');
          this.renderByTerm();
        },
        renderByTerm() {
          const t = document.getElementById('termSelect').value;
          document.getElementById('rankingTitle').innerText = `${t} 平均NET`;
          if (!State.rankingCache[t]) {
            const obj = State.rankingByTerm[t], list = [];
            for (const n in obj) list.push({ name: n, avg: Math.round((obj[n].reduce((a,b)=>a+b,0)/obj[n].length)*10)/10, count: obj[n].length });
            State.rankingCache[t] = list.sort((a, b) => a.avg - b.avg);
          }
          let html = '';
          State.rankingCache[t].forEach((m, i) => {
            let rs = "text-gray-700", rb = `${i+1}位`;
            if (i===0) { rs = "text-yellow-600 font-bold"; rb = "🥇 1位"; } else if (i===1) { rs = "text-gray-500 font-bold"; rb = "🥈 2位"; } else if (i===2) { rs = "text-amber-700 font-bold"; rb = "🥉 3位"; }
            const isMe = (m.name === State.currentUser);
            html += `<tr class="border-b ${isMe ? "bg-blue-50 font-semibold" : "hover:bg-gray-50"}"><td class="p-2 text-center ${rs}">${rb}</td><td class="p-2 font-bold ${isMe ? "text-blue-800" : "text-gray-800"}">${m.name}</td><td class="p-2 text-right font-semibold text-green-700">${m.avg}</td><td class="p-2 pr-4 text-right text-gray-500">${m.count} 回</td></tr>`;
          });
          document.getElementById('rankingTableBody').innerHTML = html;
        }
      };

      // ─────────────────────────────────────
      // Main Actions (Upload, Reset, loadAll)
      // ─────────────────────────────────────
      async function loadAllData() {
        UI.showSkeletons();
        try {
          const [history, myHistory] = await Promise.all([ API.call('getScoreHistory'), API.call('getMyScoreHistory') ]);
          if (history && history.length > 0) { State.allScoreHistory = history; Score.setup(); Ranking.setup(); }
          if (myHistory && myHistory.length > 0) ChartModule.loadMyChart(myHistory);
        } catch { UI.showErrorAndRetry(); }
      }

      window.onLogin = () => Auth.login();
      window.onLogout = () => Auth.logout();
      window.handleEnterKey = (e, fn) => UI.handleEnterKey(e, fn);
      window.loadAllData = () => loadAllData();
      window.toggleFutureSchedules = () => document.getElementById('futureSchedulesSection').classList.toggle('hidden');
      window.toggleOfficialHdcpHistory = () => ChartModule.loadOfficialHdcpHistory();
      window.toggleScoreView = (v) => UI.toggleScoreView(v);
      window.renderScoresByDate = () => Score.renderByDate();
      window.renderRankingByTerm = () => Ranking.renderByTerm();

      window.onUpload = async () => {
        const fileInput = document.getElementById('imageFile'), btn = document.getElementById('uploadBtn'), st = document.getElementById('uploadStatus');
        if (fileInput.files.length === 0) return alert('画像を選択してください。');
        st.innerText = "画像を解析中...（最大数分）"; btn.disabled = true;
        const reader = new FileReader();
        reader.onloadend = async () => {
          try {
            const res = await API.call('uploadAndProcessImage', { base64Data: reader.result.split(',')[1], mimeType: fileInput.files[0].type });
            if (res.success) { st.innerText = `成功！${res.count}件登録しました。`; loadAllData(); } else st.innerText = "エラー: " + res.error;
          } catch { st.innerText = "通信エラーが発生しました。"; } finally { btn.disabled = false; }
        };
        reader.readAsDataURL(fileInput.files[0]);
      };

      window.onResetPassword = async () => {
        const targetId = document.getElementById('resetTargetId').value.trim(), newPassword = document.getElementById('resetNewPassword').value.trim();
        const st = document.getElementById('resetPasswordStatus'), btn = document.getElementById('resetPasswordBtn');
        if (!targetId || !newPassword) { st.innerText = '入力してください。'; st.className = 'mt-2 text-xs font-semibold text-red-600'; return; }
        btn.disabled = true; btn.innerText = '処理中...'; st.innerText = '';
        try {
          const res = await API.call('resetMemberPassword', { targetId, newPassword });
          if (res.success) { st.innerText = res.message; st.className = 'mt-2 text-xs font-semibold text-green-700'; document.getElementById('resetTargetId').value = ''; document.getElementById('resetNewPassword').value = ''; }
          else { st.innerText = 'エラー: ' + res.error; st.className = 'mt-2 text-xs font-semibold text-red-600'; }
        } catch { st.innerText = '通信エラーが発生しました。'; st.className = 'mt-2 text-xs font-semibold text-red-600'; } finally { btn.disabled = false; btn.innerText = 'パスワードをリセット'; }
      };

    })();
  </script>
</body>
</html>
