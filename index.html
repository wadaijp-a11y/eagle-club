<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>イーグル会</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-4 text-gray-800">

  <div id="loginSection" class="w-full max-w-md bg-white rounded-xl shadow-md p-6 mt-10">
    <h1 class="text-2xl font-bold mb-6 text-center text-green-700 tracking-wider">イーグル会</h1>
    <form id="loginForm" onsubmit="onLogin(event)" novalidate class="space-y-4 mb-6">
      <div>
        <label for="loginId" class="block text-gray-700 text-sm font-bold mb-1">ログインID</label>
        <input type="text" id="loginId" autocomplete="username"
          class="w-full p-2.5 border border-gray-300 rounded focus:outline-none focus:border-green-500 transition-colors">
      </div>
      <div>
        <label for="loginPw" class="block text-gray-700 text-sm font-bold mb-1">パスワード</label>
        <input type="password" id="loginPw" autocomplete="current-password"
          class="w-full p-2.5 border border-gray-300 rounded focus:outline-none focus:border-green-500 transition-colors">
      </div>
      <button type="submit" id="loginBtn" aria-label="ログインする"
        class="w-full bg-green-600 text-white font-bold p-3 rounded-lg hover:bg-green-700 transition-colors shadow-sm">
        ログイン
      </button>
    </form>
    <p id="loginError" class="text-red-500 mt-2 text-center text-sm font-bold hidden" role="alert"></p>
  </div>

  <div id="mainSection" class="w-full max-w-md mt-4 hidden space-y-6 pb-10"></div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxCJVXqWdaWewEggPJ4t8VYZUK_aR3zYG1ytSqmvzx2VN-_QR8HuLRp4Jic5Z-D-7PUaQ/exec";

    // ==========================================
    // STATE
    // ==========================================
    const State = {
      authRes:               null,
      currentUser:           null,
      authToken:             null,
      allScoreHistory:       [],
      rankingByTerm:         {},
      availableRankingTerms: [],
      currentRankingTab:     'official',
      isOfficialHistoryLoaded: false,
      officialChartInstance: null,
      myChartInstance:       null,
      versusChartInstance:   null,
      gender:                'male',
      myOfficialHdcp:        '-',
      memberList:            [],
      allOfficialHdcpHistory: [],      // 追加
      memberHdcpChartInstance: null,   // 追加
    };

    // ==========================================
    // UTILS
    // ==========================================
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s])
      );
    }

    // 【修正⑤】Date経由の堅牢なフォーマット
    function formatYearMonth(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return String(dateStr);
      return `${String(d.getFullYear()).slice(-2)}年${d.getMonth() + 1}月`;
    }

    async function callGasApi(action, data = {}) {
      const payload = { action, ...data };
      if (State.authToken) payload.token = State.authToken;
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload),
        redirect: 'follow',
      });
      return res.json();
    }

    // ==========================================
    // ログイン
    // ==========================================
    /**
     * フロントエンドでSHA-256ハッシュ化する設計意図：
     * GAS＋スプレッドシートは管理者が Logger.log() を1行追加するだけで
     * 生パスワードを盗み見できる透明性の高すぎるインフラ。
     * ユーザーのスマホ内（Web Crypto API）でハッシュ化することで、
     * ネットワーク上にも GAS 上にも生パスワードが存在しない設計とする。
     * ※ Pass-the-Hash リスクは HTTPS 強制により経路傍受の可能性が極めて低く許容。
     * ※ GAS の CPU リソース節約（無料枠の保護）にも寄与。
     */
    async function hashPassword(plainText) {
      const msgBuffer  = new TextEncoder().encode(plainText);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function onLogin(event) {
      event.preventDefault();
      const id  = document.getElementById('loginId').value.trim();
      const pw  = document.getElementById('loginPw').value;
      const err = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');

      if (!id || !pw) {
        err.textContent = 'IDとパスワードを入力してください';
        err.classList.remove('hidden');
        return;
      }

      err.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = '認証中...';

      try {
        // フロントでハッシュ化してから送信（生パスワードはネットワーク・GAS上に存在しない）
        const hashedPw = await hashPassword(pw);
        const res = await callGasApi('checkLogin', { id, password: hashedPw });

        if (res.success) {
          document.getElementById('loginPw').value = '';
          initSession(res);
        } else {
          err.textContent = res.error || 'IDまたはパスワードが違います';
          err.classList.remove('hidden');
        }
      } catch {
        err.textContent = '通信エラーが発生しました';
        err.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'ログイン';
      }
    }

    async function onLogout() {
      await callGasApi('logout').catch(() => {});
      State.authToken   = null;
      State.currentUser = null;
      State.authRes     = null;
      document.getElementById('mainSection').innerHTML = '';
      document.getElementById('mainSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('loginId').value = '';
    }

    // ==========================================
    // セッション初期化・DOM構築
    // ==========================================
    function initSession(res) {
      State.authRes               = res;
      State.currentUser           = res.name;
      State.authToken             = res.token;
      State.gender                = res.gender || 'male';
      State.myOfficialHdcp        = res.officialHdcp || '-';
      State.isOfficialHistoryLoaded = false;

      buildMainUI(res);

      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('mainSection').classList.remove('hidden');

      loadAllData();
    }

    function buildMainUI(res) {
      const isAdmin = res.role === '管理者';
      const main    = document.getElementById('mainSection');

      main.innerHTML = `
        ${buildScheduleCard(res)}
        ${buildUserHeader(res)}
        ${buildHdcpCard(res)}
        ${isAdmin ? buildAdminUploadCard() : ''}
        ${isAdmin ? buildAdminPasswordCard() : ''}
        ${buildMyScoreCard()}
        ${buildVersusCard()}
        ${buildCompeResultCard()}
        ${buildRankingCard()}
      `;
      CourseHdcp.render();
      setupScheduleDisplay(res);
    }

    // ---- カードビルダー群 ----
    function buildScheduleCard(res) {
      // 【修正④】初期値を「未定」にしてチラつき防止
      return `
        <div class="bg-white border-2 border-green-500 rounded-xl shadow-sm overflow-hidden">
          <div class="bg-green-500 text-white text-sm font-bold py-1.5 text-center tracking-widest flex items-center justify-center gap-2">
            <span>🏌️</span> 次回イーグル会 開催予定
          </div>
          <div class="p-4 bg-green-50 text-center space-y-2.5">
            <p id="nextCompeDateDisplay" class="text-xl font-bold text-green-800 leading-relaxed break-keep">未定</p>
            <div id="nextClubCompeBadge" class="hidden">
              <span class="inline-block bg-amber-100 border border-amber-200 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-md shadow-sm animate-pulse">
                🏆 公式競技: <span id="nextClubCompeName"></span>
              </span>
            </div>
            <div id="scheduleToggleBtnContainer" class="hidden pt-2 border-t border-green-200/60 mt-2">
              <button onclick="toggleFutureSchedules()" aria-label="今後のスケジュールを表示"
                class="text-xs text-green-700 font-bold bg-green-100 hover:bg-green-200 transition-colors px-3 py-1 rounded-full inline-flex items-center gap-1 shadow-sm">
                <span>📅 今後のスケジュール</span>（<span id="futureScheduleCount">0</span>件）
              </button>
            </div>
          </div>
          <div id="futureSchedulesSection" class="hidden border-t border-green-100 bg-white p-3 max-h-48 overflow-y-auto">
            <div id="futureSchedulesList" class="space-y-3"></div>
          </div>
        </div>`;
    }

    function buildUserHeader(res) {
      return `
        <div class="flex justify-between items-end px-1">
          <h2 class="text-xl font-bold text-green-700">こんにちは、${escapeHtml(res.name)} さん</h2>
          <button onclick="onLogout()" aria-label="ログアウトする"
            class="text-xs text-gray-500 underline hover:text-gray-700">ログアウト</button>
        </div>`;
    }

    function buildHdcpCard(res) {
      return `
        <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm">
          <h3 class="font-bold text-gray-800 border-b pb-2 mb-3">⛳ あなたの最新ハンディキャップ</h3>
          <div class="grid grid-cols-2 gap-3 text-center items-stretch">
            <div class="bg-blue-50 rounded-lg p-2.5 border border-blue-100 flex flex-col justify-between">
              <div>
                <p class="text-xs text-gray-600 font-bold mb-1">イーグル会 HDCP</p>
                <p id="eagleHdcpDisplay" class="text-3xl font-bold text-blue-700 my-1">${escapeHtml(String(res.eagleHdcp || '-'))}</p>
                <p class="text-xs text-gray-500 mb-2">更新日: <span id="eagleUpdateDisplay">${escapeHtml(res.eagleUpdateDate || '')}</span></p>
                <div class="mb-1.5">
                  <span class="inline-block bg-white border border-blue-200 text-blue-700 text-xs font-bold px-1.5 py-0.5 rounded shadow-sm">
                    ⛳ 使用ティー: <span id="eagleTeeDisplay">${escapeHtml(res.eagleTee || '未設定')}</span>
                  </span>
                </div>
              </div>
              <div class="mt-auto">
                <p class="text-xs text-blue-600 font-semibold bg-blue-100/70 inline-block px-2 py-1 rounded-md">※1月と7月にHDCPリセット</p>
              </div>
            </div>
            <div class="bg-purple-50 rounded-lg p-2.5 border border-purple-100 flex flex-col justify-between">
              <div>
                <p class="text-xs text-gray-600 font-bold mb-1">倶楽部公式 HDCP</p>
                <p id="officialHdcpDisplay" class="text-3xl font-bold text-purple-700 my-1">${escapeHtml(String(res.officialHdcp || '-'))}</p>
                <p class="text-xs text-gray-500 mb-1">更新日: <span id="officialUpdateDisplay">${escapeHtml(res.officialUpdateDate || '')}</span></p>
              </div>
              <div id="courseHdcpContainer" class="flex flex-wrap gap-1 mt-1 mb-3 justify-center min-h-6"></div>
              <div class="mt-auto">
                <button onclick="toggleOfficialHdcpHistory()" aria-label="HDCP推移を表示"
                  class="text-xs text-purple-700 font-bold bg-purple-100 hover:bg-purple-200 transition-colors px-2 py-1 rounded-md w-full text-center block">
                  📊 1年の推移を見る
                </button>
              </div>
            </div>
          </div>
          <div id="officialHdcpHistorySection" class="hidden mt-4 pt-4 border-t border-dashed border-gray-200 space-y-4">
            <div class="py-1"><canvas id="officialHdcpChart"></canvas></div>
            <div class="max-h-40 overflow-y-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="bg-gray-50 border-b text-gray-500">
                    <th scope="col" class="p-2 font-normal">年月</th>
                    <th scope="col" class="p-2 text-right pr-4 font-normal">公式HDCP</th>
                  </tr>
                </thead>
                <tbody id="officialHdcpTableBody">
                  <tr><td colspan="2" class="text-center p-2 text-gray-400">履歴データを読み込み中...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>`;
    }

    function buildAdminUploadCard() {
      return `
        <div class="border-2 border-dashed border-green-300 rounded-xl p-4 bg-green-50 text-center">
          <h3 class="font-bold text-green-800 mb-2 text-sm">【管理者用】成績表アップロード</h3>
          <input type="file" id="imageFile" accept="image/*" class="mb-3 text-xs text-gray-600 w-full">
          <button onclick="onUpload()" id="uploadBtn"
            class="w-full bg-blue-600 text-white text-sm font-bold p-2 rounded hover:bg-blue-700 transition-colors">
            画像を解析して登録
          </button>
          <p id="uploadStatus" class="mt-2 text-xs text-gray-700 font-semibold"></p>
        </div>`;
    }

    function buildAdminPasswordCard() {
      return `
        <div class="border-2 border-dashed border-orange-300 rounded-xl p-4 bg-orange-50">
          <h3 class="font-bold text-orange-800 mb-3 text-sm text-center">【管理者用】パスワードリセット</h3>
          <div class="space-y-2 text-left">
            <div>
              <label for="resetTargetId" class="block text-xs font-bold text-gray-700 mb-1">対象のログインID</label>
              <input type="text" id="resetTargetId"
                class="w-full p-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-orange-400">
            </div>
            <div>
              <label for="resetNewPassword" class="block text-xs font-bold text-gray-700 mb-1">新しいパスワード</label>
              <input type="text" id="resetNewPassword"
                class="w-full p-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-orange-400"
                placeholder="8文字以上">
            </div>
          </div>
          <button onclick="onResetPassword()" id="resetPasswordBtn"
            class="w-full mt-3 bg-orange-500 text-white text-sm font-bold p-2 rounded hover:bg-orange-600 transition-colors">
            パスワードをリセット
          </button>
          <p id="resetPasswordStatus" class="mt-2 text-xs font-semibold text-gray-700" role="alert"></p>
        </div>`;
    }

    function buildMyScoreCard() {
      return `
        <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm">
          <div class="flex justify-between items-center border-b pb-2 mb-3">
            <h3 class="font-bold text-gray-800">📈 イーグル会スコア推移</h3>
            <div class="flex space-x-1 bg-gray-100 rounded-md p-1 border border-gray-200">
              <button id="btnChart" onclick="toggleScoreView('chart')" aria-label="グラフ表示"
                class="text-xs px-3 py-1 rounded bg-white shadow-sm text-gray-800 font-bold transition-all">グラフ</button>
              <button id="btnTable" onclick="toggleScoreView('table')" aria-label="表表示"
                class="text-xs px-3 py-1 rounded text-gray-500 hover:text-gray-800 font-bold transition-all">表</button>
            </div>
          </div>
          <div id="myScoreEmpty" class="hidden text-center text-sm text-gray-500 py-6">スコアデータがまだありません</div>
          <div id="scoreChartContainer" class="py-2"><canvas id="myChart"></canvas></div>
          <div id="scoreTableContainer" class="hidden max-h-60 overflow-y-auto">
            <table class="w-full text-left border-collapse text-sm">
              <thead>
                <tr class="bg-gray-50 border-b text-gray-500 text-xs">
                  <th scope="col" class="p-2 font-normal">日付</th>
                  <th scope="col" class="p-2 text-right font-normal">順位</th>
                  <th scope="col" class="p-2 text-right font-normal">GROSS</th>
                  <th scope="col" class="p-2 pr-4 text-right font-normal">NET</th>
                </tr>
              </thead>
              <tbody id="myScoreTableBody"></tbody>
            </table>
          </div>
        </div>`;
    }

    function buildVersusCard() {
      return `
        <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm">
          <div class="flex justify-between items-center border-b pb-2 mb-3">
            <h3 class="font-bold text-gray-800">⚔️ ライバル対決 <span class="text-xs text-gray-500 font-normal ml-1">(GROSS)</span></h3>
          </div>
          <div class="mb-3">
            <select id="vsOpponentSelect" onchange="Versus.render()" aria-label="対戦相手を選択"
              class="w-full text-sm border border-gray-300 rounded p-2 text-gray-700 bg-white shadow-sm focus:outline-none focus:border-green-500 hidden">
            </select>
          </div>
          <div id="versusContainer">
            <div class="text-center p-4 text-gray-400 text-xs">対戦相手を読み込んでいます...</div>
          </div>
        </div>`;
    }

    function buildCompeResultCard() {
      return `
        <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm">
          <div class="flex justify-between items-center border-b pb-2 mb-3">
            <h3 class="font-bold text-gray-800">🏆 イーグル会の結果</h3>
            <select id="dateSelect" onchange="renderScoresByDate()" aria-label="開催日選択"
              class="text-xs border border-gray-300 rounded p-1.5 text-gray-700 bg-white shadow-sm focus:outline-none focus:border-green-500 hidden">
            </select>
          </div>
          <div class="max-h-60 overflow-y-auto">
            <table class="w-full text-left border-collapse text-sm">
              <thead>
                <tr class="bg-gray-50 border-b text-gray-500 text-xs">
                  <th scope="col" class="p-2 w-16 text-center font-normal">順位</th>
                  <th scope="col" class="p-2 font-normal">名前</th>
                  <th scope="col" class="p-2 text-right font-normal">GROSS</th>
                  <th scope="col" class="p-2 pr-4 text-right font-normal">NET</th>
                </tr>
              </thead>
              <tbody id="scoreContainer"></tbody>
            </table>
          </div>
        </div>`;
    }

    function buildRankingCard() {
      return `
        <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-gray-800">🏅 メンバーランキング</h3>
          </div>
          <div class="flex space-x-1 bg-gray-100 rounded-md p-1 border border-gray-200 mb-3" id="rankingTabsContainer"></div>
          <div class="max-h-60 overflow-y-auto">
            <table class="w-full text-left border-collapse text-sm">
              <thead id="rankingTableHeader"></thead>
              <tbody id="rankingTableBody">
                <tr><td colspan="4" class="text-center p-4 text-gray-400 text-xs">データを読み込んでいます...</td></tr>
              </tbody>
            </table>
          </div>
        </div>`;
    }

    // ==========================================
    // スケジュール表示
    // ==========================================
    function setupScheduleDisplay(res) {
      if (res.nextCompe) {
        document.getElementById('nextCompeDateDisplay').textContent =
          `${res.nextCompe.dateText} ${res.nextCompe.timeText}`;
        if (res.nextCompe.clubCompe) {
          document.getElementById('nextClubCompeName').textContent = res.nextCompe.clubCompe;
          document.getElementById('nextClubCompeBadge').classList.remove('hidden');
        }
      }
      // nextCompeがnullの場合は初期値「未定」のまま（チラつきなし）

      const listContainer = document.getElementById('futureSchedulesList');
      if (res.futureSchedules && res.futureSchedules.length > 0) {
        document.getElementById('futureScheduleCount').textContent = res.futureSchedules.length;
        document.getElementById('scheduleToggleBtnContainer').classList.remove('hidden');
        listContainer.innerHTML = res.futureSchedules.map(s => `
          <div class="flex flex-col border-b border-gray-100 pb-2.5 last:border-0 last:pb-0">
            <div class="flex justify-between items-center text-xs">
              <span class="font-bold text-gray-800">${escapeHtml(s.dateText)}</span>
              <span class="text-gray-500 font-semibold bg-gray-100 px-2 py-0.5 rounded shadow-sm">${escapeHtml(s.timeText)}</span>
            </div>
            ${s.clubCompe ? `<div class="mt-1 text-xs text-amber-700 font-bold flex items-center gap-1"><span>🏆 公式競技:</span><span>${escapeHtml(s.clubCompe)}</span></div>` : ''}
          </div>`).join('');
      }
    }

    function toggleFutureSchedules() {
      document.getElementById('futureSchedulesSection').classList.toggle('hidden');
    }

    // ==========================================
    // データ一括取得
    // ==========================================
    function showSkeletons() {
      const row = `
        <tr class="animate-pulse border-b">
          <td class="p-3"><div class="h-3 bg-gray-200 rounded w-3/4 mx-auto"></div></td>
          <td class="p-3"><div class="h-3 bg-gray-200 rounded w-full"></div></td>
          <td class="p-3"><div class="h-3 bg-gray-200 rounded w-1/2 ml-auto"></div></td>
          <td class="p-3 pr-4"><div class="h-3 bg-gray-200 rounded w-1/2 ml-auto"></div></td>
        </tr>`.repeat(5);
      ['scoreContainer', 'rankingTableBody', 'myScoreTableBody'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = row;
      });
    }

    // 【要確認①対応】エラー時にmainSection全体を差し替えてUI崩れを防止
    function showErrorAndRetry() {
      const main = document.getElementById('mainSection');
      if (main) {
        main.innerHTML = `
          <div class="bg-white border border-red-200 rounded-xl p-6 text-center shadow-sm">
            <p class="text-red-500 font-bold mb-4">データの取得に失敗しました。<br>通信環境をご確認ください。</p>
            <button onclick="retryLoadAllData()"
              class="bg-blue-600 hover:bg-blue-700 transition-colors text-white px-4 py-2 rounded-lg font-bold shadow-sm">
              再読み込み
            </button>
          </div>`;
      }
    }

    function retryLoadAllData() {
      if (State.authRes) buildMainUI(State.authRes);
      loadAllData();
    }

async function loadAllData() {
      showSkeletons();
      try {
        const [history, members, hdcpHistory] = await Promise.all([
          callGasApi('getScoreHistory'),
          callGasApi('getMemberList'),
          callGasApi('getAllOfficialHdcpHistory') // 追加
        ]);

        if (members && members.length > 0) State.memberList = members;
        if (hdcpHistory) State.allOfficialHdcpHistory = hdcpHistory; // 追加

        if (history && history.length > 0) {
          State.allScoreHistory = history;
          const myHistory = history
            .filter(r => r['名前'] === State.currentUser)
            .map(r => ({ date: r['日付'], rank: r['順位'], gross: r['GROSS'], hdcp: r['HDCP'], net: r['NET'] }));

          setupCompeResults();
          setupRanking();
          Versus.setup();
          loadMyChart(myHistory);
        }
      } catch {
        showErrorAndRetry();
      }
    }

    // ==========================================
    // コースHDCP計算
    // ==========================================
    const CourseHdcp = {
      RATINGS: {

    function toggleOfficialHdcpHistory() {

async function loadOfficialHdcpHistory() {
      try {
        State.isOfficialHistoryLoaded = true;
        const tbody = document.getElementById('officialHdcpTableBody');

        // 通信を削除し、Stateから自分用のデータを抽出してソート
        const myNameNorm = State.currentUser.replace(/\s+/g, '');
        const history = State.allOfficialHdcpHistory.filter(r => r.name === myNameNorm);

        if (!history || history.length === 0) {
          tbody.innerHTML = `<tr><td colspan="2" class="text-center p-4 text-gray-400 text-xs">直近1年の履歴データがありません</td></tr>`;
          return;
        }

        const valid  = history.filter(r => r.hdcp !== '不明' && !isNaN(Number(r.hdcp)));
        const labels = valid.map(r => formatYearMonth(r.date));
        const values = valid.map(r => Number(r.hdcp));

        const ctx = document.getElementById('officialHdcpChart').getContext('2d');
        if (State.officialChartInstance) State.officialChartInstance.destroy();
        if (values.length > 0) {
          State.officialChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
              labels,
              datasets: [{
                label: '公式HDCP', data: values,
                borderColor: 'rgb(147,51,234)', backgroundColor: 'rgba(147,51,234,0.1)',
                borderWidth: 2, pointRadius: 4, pointBackgroundColor: 'rgb(147,51,234)', tension: 0.3,
              }],
            },
            options: {
              responsive: true,
              plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
              scales: { y: { reverse: true } },
            },
          });
        }

        tbody.innerHTML = [...history].reverse().map(r => {
          const hdcp = r.hdcp === '不明'
            ? '<span class="text-red-500 font-bold bg-red-50 px-1.5 py-0.5 rounded">不明</span>'
            : escapeHtml(String(r.hdcp));
          return `<tr class="border-b hover:bg-gray-50 text-xs">
            <td class="p-2 text-gray-600 font-medium">${escapeHtml(formatYearMonth(r.date))}</td>
            <td class="p-2 text-right pr-4 font-bold text-purple-700">${hdcp}</td>
          </tr>`;
        }).join('');
      } catch {
        document.getElementById('officialHdcpTableBody').innerHTML =
          `<tr><td colspan="2" class="text-center p-4 text-red-500 text-xs">通信エラー</td></tr>`;
      }
    }

    // ==========================================
    // ランキング
    // ==========================================
    function setupRanking() {
      State.rankingByTerm = {};
      State.allScoreHistory.forEach(row => {
        // 【修正】Date経由で年・月を取得（スラッシュ分割廃止）
        const d = new Date(row['日付']);
        if (isNaN(d.getTime())) return;
        const year    = String(d.getFullYear()).slice(-2);
        const month   = d.getMonth() + 1;
        const termKey = `${year}年${month >= 7 ? '下期' : '上期'}`;
        if (!State.rankingByTerm[termKey]) State.rankingByTerm[termKey] = {};
        const net = Number(row['NET']);
        if (row['名前'] && !isNaN(net)) {
          if (!State.rankingByTerm[termKey][row['名前']]) State.rankingByTerm[termKey][row['名前']] = [];
          State.rankingByTerm[termKey][row['名前']].push(net);
        }
      });

      const terms = Object.keys(State.rankingByTerm).sort((a, b) => {
        const ya = parseInt(a), la = a.includes('下期') ? 1 : 0;
        const yb = parseInt(b), lb = b.includes('下期') ? 1 : 0;
        return ya !== yb ? yb - ya : lb - la;
      });
      State.availableRankingTerms = terms.slice(0, 2);

      renderRankingTabs();
      changeRankingTab('official');
    }

    function renderRankingTabs() {
      const container = document.getElementById('rankingTabsContainer');
      const tabClass  = 'flex-1 text-xs px-1 py-1 rounded font-bold transition-all leading-tight';
      container.innerHTML = `
        <button onclick="changeRankingTab('official')" id="tab_official"
          class="${tabClass} text-gray-500 hover:text-gray-800">公式HDCP</button>
        ${State.availableRankingTerms.map((term, i) => `
          <button onclick="changeRankingTab('${escapeHtml(term)}')" id="tab_${escapeHtml(term)}"
            class="${tabClass} text-gray-500 hover:text-gray-800 text-center">
            ${i === 0 ? '今期' : '前期'} NET<br><span class="text-xs font-normal">(${escapeHtml(term)})</span>
          </button>`).join('')}`;
    }

    function changeRankingTab(tabId) {
      State.currentRankingTab = tabId;
      const tabClass = 'flex-1 text-xs px-1 py-1 rounded font-bold transition-all leading-tight';
      const tabs     = document.getElementById('rankingTabsContainer').children;
      for (const tab of tabs) tab.className = `${tabClass} text-gray-500 hover:text-gray-800`;

      const activeId = tabId === 'official' ? 'tab_official' : `tab_${tabId}`;
      const activeEl = document.getElementById(activeId);
      if (activeEl) {
        const color = tabId === 'official' ? 'text-purple-700' : 'text-green-700';
        activeEl.className = `${tabClass} bg-white shadow-sm ${color} border border-gray-200/50`;
      }
      renderRankingContent();
    }

    // ==========================================
    // ライバル対決
    // ==========================================
    const Versus = {
      setup() {
        const sel    = document.getElementById('vsOpponentSelect');
        const myHdcp = parseFloat(State.myOfficialHdcp);

        const dateMap = {};
        State.allScoreHistory.forEach(r => {
          if (!dateMap[r['日付']]) dateMap[r['日付']] = {};
          dateMap[r['日付']][r['名前']] = true;
        });

        let closest = null, minDiff = Infinity, maxGames = -1;
        const options = State.memberList
          .filter(m => m.name !== State.currentUser)
          .map(m => {
            if (!isNaN(myHdcp) && m.hdcp !== 999) {
              const diff  = Math.abs(myHdcp - m.hdcp);
              const games = Object.values(dateMap).filter(d => d[State.currentUser] && d[m.name]).length;
              if (diff < minDiff || (diff === minDiff && games > maxGames)) {
                minDiff = diff; maxGames = games; closest = m.name;
              }
            }
            return m;
          });

        if (options.length === 0) {
          document.getElementById('versusContainer').innerHTML =
            `<div class="text-center p-4 text-gray-400 text-xs">対戦可能なメンバーがいません</div>`;
          return;
        }

        sel.innerHTML = options.map(m =>
          `<option value="${escapeHtml(m.name)}">${escapeHtml(m.name)} (HDCP: ${m.hdcp === 999 ? '-' : m.hdcp})</option>`
        ).join('');
        sel.classList.remove('hidden');
        if (closest) sel.value = closest;
        this.render();
      },

      render() {
        const opName   = document.getElementById('vsOpponentSelect').value;
        const myName   = State.currentUser;
        const opMember = State.memberList.find(m => m.name === opName);
        const opHdcp   = opMember && opMember.hdcp !== 999 ? opMember.hdcp : '-';

        const dateMap = {};
        State.allScoreHistory.forEach(r => {
          if (!dateMap[r['日付']]) dateMap[r['日付']] = {};
          dateMap[r['日付']][r['名前']] = r;
        });

        let win = 0, lose = 0, draw = 0;
        const versusData = Object.entries(dateMap)
          .filter(([, d]) => d[myName] && d[opName])
          .map(([date, d]) => {
            const myG = Number(d[myName]['GROSS']), opG = Number(d[opName]['GROSS']);
            if (isNaN(myG) || isNaN(opG)) return null;
            // 【修正】勝敗文字列を '勝利'/'敗北'/'引分' で統一
            let result = '引分';
            if (myG < opG) { result = '勝利'; win++; }
            else if (myG > opG) { result = '敗北'; lose++; }
            else draw++;
            return { date, myGross: myG, opGross: opG, result };
          })
          .filter(Boolean)
          .sort((a, b) => new Date(a.date) - new Date(b.date));

        const container = document.getElementById('versusContainer');
        const vsHeader  = `
          <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-200 mb-3">
            <div class="text-center w-1/3">
              <p class="text-xs text-gray-500 font-bold mb-0.5">あなた</p>
              <p class="text-sm font-bold text-blue-700 truncate">${escapeHtml(myName)}</p>
              <p class="text-xs text-gray-500">公式HDCP: ${escapeHtml(String(State.myOfficialHdcp))}</p>
            </div>
            <div class="text-center w-1/3 flex flex-col items-center">
              <span class="text-xs font-black text-gray-400 italic mb-1">VS</span>
              ${versusData.length > 0
                ? `<span class="text-xs font-bold px-2 py-0.5 rounded bg-white border border-gray-200 shadow-sm text-gray-700 whitespace-nowrap">
                    <span class="text-blue-600">${win}勝</span> <span class="text-red-500">${lose}敗</span> ${draw}分
                   </span>`
                : `<span class="text-xs text-gray-400 font-bold">対戦なし</span>`}
            </div>
            <div class="text-center w-1/3">
              <p class="text-xs text-gray-500 font-bold mb-0.5">ライバル</p>
              <p class="text-sm font-bold text-gray-800 truncate">${escapeHtml(opName)}</p>
              <p class="text-xs text-gray-500">公式HDCP: ${escapeHtml(String(opHdcp))}</p>
            </div>
          </div>`;

        if (versusData.length === 0) { container.innerHTML = vsHeader; return; }

        const tableRows = [...versusData].reverse().map(r => {
          // 【修正】'勝利'/'敗北'/'引分' で統一しているためバッジも正しく表示される
          const badge   = r.result === '勝利'
            ? `<span class="bg-blue-500 text-white px-1.5 py-0.5 rounded shadow-sm text-xs font-bold">勝利</span>`
            : r.result === '敗北'
            ? `<span class="bg-red-400 text-white px-1.5 py-0.5 rounded shadow-sm text-xs font-bold">敗北</span>`
            : `<span class="bg-gray-200 text-gray-600 px-1.5 py-0.5 rounded shadow-sm text-xs font-bold">引分</span>`;
          const myColor = r.result === '勝利' ? 'text-blue-700 font-black' : 'text-gray-700 font-semibold';
          const opColor = r.result === '敗北' ? 'text-red-500 font-black' : 'text-gray-500 font-semibold';
          return `<tr class="border-b hover:bg-gray-50">
            <td class="p-2 text-gray-600 text-xs font-bold">${escapeHtml(formatYearMonth(r.date))}</td>
            <td class="p-2 text-center ${myColor}">${r.myGross}</td>
            <td class="p-2 text-center ${opColor}">${r.opGross}</td>
            <td class="p-2 pr-4 text-right">${badge}</td>
          </tr>`;
        }).join('');

        container.innerHTML = `
          ${vsHeader}
          <div class="py-1"><canvas id="versusChart"></canvas></div>
          <div class="max-h-60 overflow-y-auto mt-2">
            <table class="w-full text-left border-collapse text-sm">
              <thead>
                <tr class="bg-gray-50 border-b text-gray-500 text-xs">
                  <th scope="col" class="p-2 font-normal">日付</th>
                  <th scope="col" class="p-2 text-center font-normal text-blue-700">あなた</th>
                  <th scope="col" class="p-2 text-center font-normal text-gray-600">相手</th>
                  <th scope="col" class="p-2 pr-4 text-right font-normal">結果</th>
                </tr>
              </thead>
              <tbody>${tableRows}</tbody>
            </table>
          </div>`;

        const recent = versusData.slice(-10);
        const ctx    = document.getElementById('versusChart').getContext('2d');
        if (State.versusChartInstance) State.versusChartInstance.destroy();
        State.versusChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: recent.map(r => formatYearMonth(r.date)),
            datasets: [
              { label: 'あなた', data: recent.map(r => r.myGross), borderColor: 'rgb(59,130,246)', backgroundColor: 'rgba(59,130,246,0.1)', borderWidth: 2, pointRadius: 4, pointBackgroundColor: 'rgb(59,130,246)', tension: 0.3 },
              { label: '相手',   data: recent.map(r => r.opGross), borderColor: 'rgb(156,163,175)', backgroundColor: 'rgba(156,163,175,0.1)', borderWidth: 2, pointRadius: 4, borderDash: [5, 5], pointBackgroundColor: 'rgb(156,163,175)', tension: 0.3 },
            ],
          },
          options: {
            responsive: true,
            plugins: { legend: { display: true, position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } }, tooltip: { mode: 'index', intersect: false } },
            scales: { y: { reverse: true } },
          },
        });
      },
    };
    window.Versus = Versus;

    // ==========================================
    // 自分のスコア推移
    // ==========================================
    function loadMyChart(history) {
      const sorted     = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));
      const recentMax10 = sorted.slice(0, 10);
      const chartData  = [...recentMax10].reverse(); // グラフ用に昇順

      const emptyEl = document.getElementById('myScoreEmpty');
      const chartEl = document.getElementById('scoreChartContainer');

      if (chartData.length === 0) {
        emptyEl.classList.remove('hidden');
        chartEl.classList.add('hidden');
        document.getElementById('myScoreTableBody').innerHTML =
          `<tr><td colspan="4" class="text-center p-4 text-gray-400 text-xs">データがありません</td></tr>`;
        return;
      }

      emptyEl.classList.add('hidden');
      chartEl.classList.remove('hidden');

      const ctx = document.getElementById('myChart').getContext('2d');
      if (State.myChartInstance) State.myChartInstance.destroy();
      State.myChartInstance = new Chart(ctx, {
        type: chartData.length === 1 ? 'bar' : 'line',
        data: {
          labels: chartData.map(r => formatYearMonth(r.date)),
          datasets: [{
            label: 'GROSS', data: chartData.map(r => r.gross),
            borderColor: 'rgb(255,99,132)', backgroundColor: 'rgba(255,99,132,0.1)',
            borderWidth: 2, pointRadius: 4, pointBackgroundColor: 'rgb(255,99,132)', tension: 0.3,
          }],
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
          scales: { y: { reverse: true } },
        },
      });

      document.getElementById('myScoreTableBody').innerHTML = recentMax10.map(row => {
        const rank      = Number(row.rank);
        const rankText  = rank === 1 ? '🥇 1位' : rank === 2 ? '🥈 2位' : rank === 3 ? '🥉 3位' : `${rank}位`;
        const rankStyle = rank === 1 ? 'text-yellow-600 font-bold' : rank === 2 ? 'text-gray-500 font-bold' : rank === 3 ? 'text-amber-700 font-bold' : 'text-gray-500';
        return `<tr class="border-b hover:bg-gray-50">
          <td class="p-2 text-gray-600 text-xs font-bold">${escapeHtml(formatYearMonth(row.date))}</td>
          <td class="p-2 text-right ${rankStyle}">${rankText}</td>
          <td class="p-2 text-right text-gray-800 font-bold">${escapeHtml(String(row.gross))}</td>
          <td class="p-2 pr-4 text-right text-green-600 font-bold">${escapeHtml(String(row.net))}</td>
        </tr>`;
      }).join('');
    }

    // ==========================================

    async function onUpload() {
      const fileInput  = document.getElementById('imageFile');
      const statusText = document.getElementById('uploadStatus');
      const btn        = document.getElementById('uploadBtn');

      if (fileInput.files.length === 0) {
        statusText.textContent = '画像ファイルを選択してください。';
        return;
      }

      statusText.textContent = 'Geminiが画像を解析中...（最大数分）';
      btn.disabled = true;

      const reader = new FileReader();
      reader.onloadend = async () => {
        try {
          const res = await callGasApi('uploadAndProcessImage', {
            base64Data: reader.result.split(',')[1],
            mimeType:   fileInput.files[0].type,
          });
          statusText.textContent = res.success
            ? `成功！ ${res.count}件のデータを登録しました。`
            : `エラー: ${res.error}`;
          if (res.success) loadAllData();
        } catch {
          statusText.textContent = '通信エラーが発生しました。';
        } finally {
          btn.disabled = false;
        }
      };
      reader.readAsDataURL(fileInput.files[0]);
    }

    // ==========================================
    // 管理者：パスワードリセット
    // ==========================================
    async function onResetPassword() {
      const targetId   = document.getElementById('resetTargetId').value.trim();
      const newPw      = document.getElementById('resetNewPassword').value.trim();
      const statusText = document.getElementById('resetPasswordStatus');
      const btn        = document.getElementById('resetPasswordBtn');

      if (!targetId || !newPw) {
        statusText.textContent = '入力してください。';
        statusText.className   = 'mt-2 text-xs font-semibold text-red-600';
        return;
      }

      btn.disabled    = true;
      btn.textContent = '処理中...';
      statusText.textContent = '';

      try {
        // 新パスワードもフロントでハッシュ化して送信（生パスワードをGASに渡さない設計と統一）
        const hashedNewPw = await hashPassword(newPw);
        const res = await callGasApi('resetMemberPassword', { targetId, newPassword: hashedNewPw });
        statusText.textContent = res.success ? res.message : `エラー: ${res.error}`;
        statusText.className   = `mt-2 text-xs font-semibold ${res.success ? 'text-green-700' : 'text-red-600'}`;
        if (res.success) {
          document.getElementById('resetTargetId').value   = '';
          document.getElementById('resetNewPassword').value = '';
        }
      } catch {
        statusText.textContent = '通信エラーが発生しました。';
        statusText.className   = 'mt-2 text-xs font-semibold text-red-600';
      } finally {
        btn.disabled    = false;
        btn.textContent = 'パスワードをリセット';
      }
    }

// ==========================================
    // メンバーHDCP推移モーダル
    // ==========================================
    function openMemberHdcpModal(memberName) {
      document.getElementById('memberHdcpModalTitle').textContent = `${memberName} さんの公式HDCP推移`;
      const noDataEl = document.getElementById('memberHdcpNoData');
      const canvasEl = document.getElementById('memberHdcpChart');
      
      const targetNameNorm = memberName.replace(/\s+/g, '');
      const history = State.allOfficialHdcpHistory.filter(r => r.name === targetNameNorm);
      const valid = history.filter(r => r.hdcp !== '不明' && !isNaN(Number(r.hdcp)));

      if (State.memberHdcpChartInstance) {
        State.memberHdcpChartInstance.destroy();
      }

      if (valid.length === 0) {
        canvasEl.classList.add('hidden');
        noDataEl.classList.remove('hidden');
      } else {
        canvasEl.classList.remove('hidden');
        noDataEl.classList.add('hidden');
        
        const ctx = canvasEl.getContext('2d');
        State.memberHdcpChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: valid.map(r => formatYearMonth(r.date)),
            datasets: [{
              label: '公式HDCP', data: valid.map(r => Number(r.hdcp)),
              borderColor: 'rgb(147,51,234)', backgroundColor: 'rgba(147,51,234,0.1)',
              borderWidth: 2, pointRadius: 4, pointBackgroundColor: 'rgb(147,51,234)', tension: 0.3,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
            scales: { y: { reverse: true } },
          },
        });
      }
      document.getElementById('memberHdcpModal').classList.remove('hidden');
    }

    function closeMemberHdcpModal() {
      document.getElementById('memberHdcpModal').classList.add('hidden');
    }

    
  </script>
  <!-- メンバーHDCP推移モーダル -->
  <div id="memberHdcpModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4 transition-opacity" onclick="closeMemberHdcpModal()">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-sm p-4" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center border-b pb-2 mb-3">
        <h3 id="memberHdcpModalTitle" class="font-bold text-gray-800 text-sm"></h3>
        <button onclick="closeMemberHdcpModal()" aria-label="閉じる" class="text-gray-400 hover:text-gray-700 text-xl font-bold leading-none">&times;</button>
      </div>
      <div class="py-1 min-h-[150px] relative">
        <canvas id="memberHdcpChart"></canvas>
        <p id="memberHdcpNoData" class="hidden absolute inset-0 flex items-center justify-center text-xs text-gray-400">データがありません</p>
      </div>
    </div>
  </div>
</body>
</html>
